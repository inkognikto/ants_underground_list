<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Справочник Муравьев - Ants Underground Kingdom</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <div class="top-bar">
            <h2>Ants Underground Kingdom</h2>
            <select onchange="location = this.value;">
                <option value="" selected>🇷🇺 RU</option>
                <option value="../en/">🇺🇸 EN</option>
            </select>
        </div>

        <div class="filters">
            <select id="filter-season">
                <option value="all">Все сезоны</option>
                <option value="0">Вне сезона (0)</option>
                <option value="1">Сезон 1</option>
                <option value="2">Сезон 2</option>
                <option value="3">Сезон 3</option>
                <option value="4">Сезон 4</option>
                <option value="5">Сезон 5</option>
                <option value="6">Сезон 6</option>
            </select>

            <select id="filter-type">
                <option value="all">Все типы</option>
                <option value="war">Битва (War)</option>
                <option value="development">Развитие (Dev)</option>
            </select>

            <select id="filter-class">
                <option value="all">Все классы</option>
                <option value="guards">Охрана (Guards)</option>
                <option value="shooters">Стрелки (Shooters)</option>
                <option value="carriers">Носители (Carriers)</option>
                <option value="neutral">Нейтральные (Neutral)</option>
            </select>
        </div>
    </header>

    <main class="ants-grid" id="ants-container"></main>

    <script>
        const LANG = 'ru'; 
        let antsData = [];

        const translateMap = {
            war: 'Битва', development: 'Развитие',
            guards: 'Охрана', shooters: 'Стрелки', carriers: 'Носители', neutral: 'Нейтрал'
        };

        async function loadAnts() {
            try {
                // Добавляем кэш-бастер (?t=...), чтобы изменения в JSON на хостинге применялись мгновенно
                const response = await fetch('../ants_data.json?t=' + new Date().getTime());
                antsData = await response.json();
                renderAnts(antsData);
            } catch (error) {
                console.error("Ошибка загрузки JSON:", error);
            }
        }

        function renderAnts(data) {
            const container = document.getElementById('ants-container');
            container.innerHTML = '';

            data.forEach(ant => {
                const name = ant[`name_${LANG}`];
                
                const card = document.createElement('div');
                card.className = 'ant-card';
                card.id = `card-${ant.id}`;
                
                // Проверяем, есть ли вообще звездные навыки у этого муравья
                const hasStars = ant[`star_skills_${LANG}`] && ant[`star_skills_${LANG}`].length > 0;

                card.innerHTML = `
                    <div class="ant-header">
                        <img class="ant-img" src="../images/ants/${ant.image}" alt="${name}" onerror="this.src='https://placeholder.com';">
                        <div class="ant-info">
                            <h3>${name}</h3>
                            <span class="badge">Сез: ${ant.season === 0 ? 'Вне' : ant.season}</span>
                            <span class="badge ${ant.type}">${translateMap[ant.type] || ant.type}</span>
                            <span class="badge">${translateMap[ant.class] || ant.class}</span>
                        </div>
                    </div>
                    
                    <!-- Переключатель звезд -->
                    <div class="star-toggle" style="${hasStars ? '' : 'display:none;'}">
                        <button class="star-btn active" onclick="switchMode('${ant.id}', 'normal')">Без звезды</button>
                        <button class="star-btn" onclick="switchMode('${ant.id}', 'star')">Со звездой ⭐</button>
                    </div>

                    <div class="skills-list" id="skills-list-${ant.id}">
                        <!-- Сюда вставятся навыки через функцию обновления -->
                    </div>
                `;
                
                container.appendChild(card);
                // Инициализируем вывод дефолтных навыков (без звезд)
                updateCardSkills(ant, 'normal');
            });
        }

        // Функция, которая перерисовывает только блок навыков конкретного муравья
        function updateCardSkills(ant, mode) {
            const listContainer = document.getElementById(`skills-list-${ant.id}`);
            listContainer.innerHTML = '';

            // Выбираем нужный массив данных в зависимости от режима (обычный или звездный)
            const key = mode === 'star' ? `star_skills_${LANG}` : `skills_${LANG}`;
            const skills = ant[key] || ant[`skills_${LANG}`] || [];

            skills.forEach((skill, index) => {
                const item = document.createElement('div');
                item.className = 'skill-item';
                item.innerHTML = `
                    <button class="skill-trigger" onclick="toggleSkill(this)">
                        ${index + 1}. ${skill.title}
                    </button>
                    <div class="skill-content">
                        <div class="skill-desc">${skill.desc}</div>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        // Переключение кнопок табов "Без звезды / Со звездой"
        function switchMode(antId, mode) {
            const card = document.getElementById(`card-${antId}`);
            const buttons = card.querySelectorAll('.star-btn');
            
            buttons.forEach(btn => btn.classList.remove('active'));
            if (mode === 'normal') buttons[0].classList.add('active');
            if (mode === 'star') buttons[1].classList.add('active');

            const ant = antsData.find(a => a.id === antId);
            updateCardSkills(ant, mode);
        }

        // Открытие/закрытие аккордеона навыка
        function toggleSkill(button) {
            const item = button.parentElement;
            const isOpen = item.classList.contains('open');
            
            // Если нужно, чтобы при открытии одного навыка закрывались другие, раскомментируйте строчки ниже:
            // const allItems = item.parentElement.querySelectorAll('.skill-item');
            // allItems.forEach(i => i.classList.remove('open'));

            if (isOpen) {
                item.classList.remove('open');
            } else {
                item.classList.add('open');
            }
        }

        function applyFilters() {
            const season = document.getElementById('filter-season').value;
            const type = document.getElementById('filter-type').value;
            const className = document.getElementById('filter-class').value;

            const filtered = antsData.filter(ant => {
                const matchSeason = (season === 'all' || ant.season.toString() === season);
                const matchType = (type === 'all' || ant.type === type);
                const matchClass = (className === 'all' || ant.class === className);
                return matchSeason && matchType && matchClass;
            });

            renderAnts(filtered);
        }

        document.getElementById('filter-season').addEventListener('change', applyFilters);
        document.getElementById('filter-type').addEventListener('change', applyFilters);
        document.getElementById('filter-class').addEventListener('change', applyFilters);

        loadAnts();
    </script>
</body>
</html>
